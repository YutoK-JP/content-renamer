[package]
name = "content_renamer"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
eframe = "0.29"
id3 = "1"
mp4ameta = "0.13"
once_cell = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
